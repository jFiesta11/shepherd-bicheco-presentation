<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shepherd</title>
    <link rel="icon" href="/assets/img/favicon.svg" />
    <link rel="stylesheet" href="./style/global.css" />
  </head>
  <body>
    <main id="app" aria-live="polite" aria-busy="true">
      <section class="screen loading-screen" aria-labelledby="loading-title">
        <div class="loading-mark" aria-hidden="true">❤︎⁠</div>
        <p class="eyebrow">Cor Motel</p>
        <h1 id="loading-title">Please Wait</h1>
        <p id="loading-status" role="status">Loading game assets…</p>
        <progress
          id="asset-progress"
          max="31"
          value="0"
          aria-label="Assets loaded"
        ></progress>
        <p id="loading-count">0 of 31 assets ready</p>
        <button id="retry-assets" type="button" hidden>
          Retry failed downloads
        </button>
      </section>
    </main>
    <script src="./js/index.js" defer></script>
  </body>
</html>
